<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scientific Calculator</title>
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <div id="app" class="calculator-app">
    <!-- Theme Toggle -->
    <div class="theme-toggle-container">
      <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark/light theme">
        🌙
      </button>
    </div>

    <!-- Main Calculator -->
    <div class="calculator-container">
      <div class="calculator">
        <!-- Display -->
        <div class="display-panel">
          <div class="previous-operand" id="previousOperand"></div>
          <div class="current-operand" id="currentOperand">0</div>
        </div>

        <!-- Buttons Grid -->
        <div class="buttons-grid">
          <!-- Row 1: Utilities -->
          <button class="btn btn-utility" data-action="clear">AC</button>
          <button class="btn btn-utility" data-action="delete">DEL</button>
          <button class="btn btn-function" data-function="sqrt">√</button>
          <button class="btn btn-operator" data-operator="/">÷</button>

          <!-- Row 2: Trig Functions -->
          <button class="btn btn-function" data-function="sin">sin</button>
          <button class="btn btn-function" data-function="cos">cos</button>
          <button class="btn btn-function" data-function="tan">tan</button>
          <button class="btn btn-operator" data-operator="*">×</button>

          <!-- Row 3: Log Functions -->
          <button class="btn btn-function" data-function="log">log</button>
          <button class="btn btn-function" data-function="ln">ln</button>
          <button class="btn btn-operator" data-operator="^">^</button>
          <button class="btn btn-operator" data-operator="-">−</button>

          <!-- Row 4: Numbers 7-9 -->
          <button class="btn btn-number" data-number="7">7</button>
          <button class="btn btn-number" data-number="8">8</button>
          <button class="btn btn-number" data-number="9">9</button>
          <button class="btn btn-operator" data-operator="+">+</button>

          <!-- Row 5: Numbers 4-6 -->
          <button class="btn btn-number" data-number="4">4</button>
          <button class="btn btn-number" data-number="5">5</button>
          <button class="btn btn-number" data-number="6">6</button>
          <button class="btn btn-function" data-function="abs">|x|</button>

          <!-- Row 6: Numbers 1-3 -->
          <button class="btn btn-number" data-number="1">1</button>
          <button class="btn btn-number" data-number="2">2</button>
          <button class="btn btn-number" data-number="3">3</button>
          <button class="btn btn-utility" data-action="negate">+/−</button>

          <!-- Row 7: 0 and Decimal -->
          <button class="btn btn-number btn-zero" data-number="0">0</button>
          <button class="btn btn-number" data-number=".">.</button>
          <button class="btn btn-equals" data-action="equals">=</button>
        </div>

        <!-- Mode Display -->
        <div class="mode-display">
          <span id="angleMode" class="mode-badge">DEG</span>
          <button id="modeToggle" class="mode-button" aria-label="Toggle angle mode (DEG/RAD)">
            Switch to RAD
          </button>
        </div>
      </div>

      <!-- History Sidebar -->
      <div class="history-panel">
        <div class="history-header">
          <h3>History</h3>
          <button id="clearHistory" class="clear-history-btn" aria-label="Clear calculation history">
            Clear
          </button>
        </div>
        <ul id="historyList" class="history-list">
          <li class="history-empty">No calculations yet</li>
        </ul>
      </div>
    </div>

    <!-- Error Message Display -->
    <div id="errorMessage" class="error-message" aria-live="polite" role="alert">
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/decimal.js@10.4.3"></script>
  <script src="https://cdn.jsdelivr.net/npm/mathjs@11.11.0"></script>
  <script src="src/calculator-core.js"></script>
  <script src="src/calculator-ui.js"></script>
  <script src="src/calculator-history.js"></script>
  <script src="src/calculator-theme.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
